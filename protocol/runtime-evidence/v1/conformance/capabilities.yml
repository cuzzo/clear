version: 1
wire_matrix:
  anchor_kinds:
    - FUNCTION_ENTRY
    - FUNCTION_RETURN
    - CALL_SELECTOR
    - STATE_READ
    - STATE_WRITE
    - CALLBACK_ENTRY
    - COLLECTION_OPERATION
    - BRANCH_PREDICATE
  planner_anchor_kinds:
    - FUNCTION_ENTRY
    - FUNCTION_RETURN
    - CALL_SELECTOR
    - STATE_WRITE
    - COLLECTION_OPERATION
    - BRANCH_PREDICATE
  reserved_anchor_kinds:
    STATE_READ: FactMine currently propagates state from observed writes and does not request read capture.
    CALLBACK_ENTRY: FactMine currently derives callback parameter flow from collection/call evidence and does not request callback-entry capture.
  evidence_kinds:
    - PARAMETER_VALUE
    - RETURN_VALUE
    - RECEIVER_VALUE
    - CALL_TARGET
    - RESULT_VALUE
    - BOOLEAN_RESULT
    - STATE_VALUE
    - COLLECTION_VALUE
  capture_statuses:
    - COMPLETE_FOR_RUNS
    - NOT_EXECUTED
    - PARTIAL
    - NOT_INSTRUMENTED
    - UNSUPPORTED
    - STALE
    - FAILED_CAPTURE
  source_roles:
    - PRODUCTION
    - NON_PRODUCTION
    - STANDARD_LIBRARY
    - DEPENDENCY
    - RUNTIME
    - UNKNOWN_SOURCE
  value_shapes: [sequence, mapping, record, tuple]
  negative_controls:
    - unknown-field
    - missing-anchor
    - duplicate-anchor
    - stale-plan-digest
    - stale-anchor-digest
    - incomplete-kind-without-field
    - complete-with-dropped-execution
    - complete-with-truncated-value
    - unknown-run-provenance
    - noncanonical-path
    - noncanonical-symbol
    - missing-call-execution-range
    - execution-range-excludes-selector
    - incompatible-anchor-evidence
  request_contracts:
    FUNCTION_ENTRY: [PARAMETER_VALUE]
    FUNCTION_RETURN: [RETURN_VALUE]
    CALL_SELECTOR: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE]
    STATE_READ: [STATE_VALUE]
    STATE_WRITE: [STATE_VALUE]
    CALLBACK_ENTRY: [PARAMETER_VALUE]
    COLLECTION_OPERATION: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE, COLLECTION_VALUE]
    BRANCH_PREDICATE: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE, BOOLEAN_RESULT]

fixture:
  language: ruby
  source: ruby/capabilities.rb
  driver: ruby/driver.rb
  support:
    - ruby/test/test_dispatcher.rb

# Each entry names a semantic capability, not a bug or application.
# `anchor` is resolved against FactMine's plan; collectors only receive the
# resulting opaque request.
cases:
  - id: exact_ruby_call
    capabilities: [exact-anchor, ruby-call, receiver, target, result]
    anchor: { method: exact_call, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize
      source_role: PRODUCTION

  - id: nil_return_call
    capabilities: [exact-anchor, nil-value]
    anchor: { method: nil_return, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize

  - id: exact_same_line_call_first
    capabilities: [ambiguous-anchor, same-line, exact-execution-range]
    anchor: { method: ambiguous_calls, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize

  - id: exact_same_line_call_second
    capabilities: [ambiguous-anchor, same-line, exact-execution-range]
    anchor: { method: ambiguous_calls, selector: normalize, occurrence: 2 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize

  - id: nested_receiver
    capabilities: [nested-receiver, chained-call, result-flow]
    anchor: { method: nested_receiver, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value

  - id: multiline_receiver
    capabilities: [multiline-call, nested-receiver, chained-call, exact-execution-range]
    anchor: { method: multiline_receiver, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize

  - id: nested_argument
    capabilities: [nested-argument, result-flow, exact-execution-range]
    anchor: { method: nested_argument, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize

  - id: assignment_result_flow
    capabilities: [assignment, result, cfg, dfg]
    anchor: { method: assignment_flow, selector: fetch, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE]
      receiver_type: Hash
      result_type: RuntimeEvidenceConformance::Value
      factmine_infers:
        - { method: assignment_flow, selector: normalize, target_owner: RuntimeEvidenceConformance::Value }

  - id: destructuring_result_flow
    capabilities: [destructuring, result, cfg, dfg]
    anchor: { method: destructuring_flow, selector: values_at, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE]
      receiver_type: Hash
      result_type: Array

  - id: short_circuit_assignment
    capabilities: [short-circuit-assignment, result, cfg, dfg]
    anchor: { method: short_circuit_flow, selector: fetch, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE]
      receiver_type: Hash
      result_type: RuntimeEvidenceConformance::Value

  - id: short_circuit_call_execution
    capabilities: [short-circuit-call, exact-execution-range, skipped-execution]
    anchor: { method: short_circuit_guard, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize
      observed_executions: 1

  - id: safe_navigation_execution
    capabilities: [safe-navigation, skipped-execution, exact-execution-range]
    anchor: { method: safe_navigation, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize
      observed_executions: 1

  - id: native_c_call
    capabilities: [native-call, receiver, target, result]
    anchor: { method: native_call, selector: upcase, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: String
      target_owner: String
      target_name: upcase
      source_role: STANDARD_LIBRARY

  - id: generated_struct_accessor
    capabilities: [generated-accessor, transparent-wrapper, native-call]
    anchor: { method: generated_accessor, selector: payload, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Generated
      target_owner: RuntimeEvidenceConformance::Generated
      target_name: payload

  - id: generated_struct_constructor
    capabilities: [generated-constructor, transparent-wrapper, native-call]
    anchor: { method: generated_constructor, selector: new, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      target_owner: RuntimeEvidenceConformance::Generated
      target_name: new

  - id: generated_struct_accessor_result_flow
    capabilities: [generated-accessor, chained-call, result-flow, transparent-wrapper]
    anchor: { method: generated_accessor_chain, selector: payload, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Generated
      target_owner: RuntimeEvidenceConformance::Generated
      target_name: payload
      factmine_infers:
        - { method: generated_accessor_chain, selector: normalize, target_owner: RuntimeEvidenceConformance::Value }

  - id: generated_struct_accessor_setter
    capabilities: [generated-accessor, generated-setter, transparent-wrapper]
    anchor: { method: generated_accessor_write, selector: payload=, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Generated
      target_owner: RuntimeEvidenceConformance::Generated
      target_name: payload=

  - id: callback_and_yield
    capabilities: [callback, yield, block-parameter, attached-block-range]
    anchor: { method: callback_flow, selector: map, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: Array
      target_owner: Array
      target_name: map
      source_role: STANDARD_LIBRARY

  - id: nested_callback_outer
    capabilities: [callback, nested-attached-blocks, exact-execution-range]
    anchor: { method: nested_callback_flow, selector: select, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: Array
      target_owner: Array
      target_name: select
      source_role: STANDARD_LIBRARY

  - id: nested_callback_inner
    capabilities: [callback, nested-attached-blocks, exact-execution-range]
    anchor: { method: nested_callback_flow, selector: map, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: Array
      target_owner: Array
      target_name: map
      source_role: STANDARD_LIBRARY

  - id: callback_local
    capabilities: [callback, block-parameter, block-local, multiline-call]
    anchor: { method: callback_local_flow, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize
      observed_executions: 2

  - id: dynamic_dispatch
    capabilities: [dynamic-dispatch, production-target]
    anchor: { method: dynamic_dispatch, selector: dispatch, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::ProductionDispatcher
      target_owner: RuntimeEvidenceConformance::ProductionDispatcher
      source_role: PRODUCTION

  - id: alternative_dynamic_targets
    capabilities: [dynamic-dispatch, alternative-receivers, alternative-targets, repeated-execution]
    anchor: { method: alternative_target, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_types:
        - RuntimeEvidenceConformance::Value
        - RuntimeEvidenceConformance::AlternateValue
      target_owners:
        - RuntimeEvidenceConformance::Value
        - RuntimeEvidenceConformance::AlternateValue
      target_name: normalize
      observed_executions: 2

  - id: container_shape
    capabilities: [result, container-shape, mapping, sequence]
    anchor: { method: container_shape, selector: fetch, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE]
      receiver_type: Hash
      result_type: Array
      result_element_type: RuntimeEvidenceConformance::Value

  - id: mapping_result_shape
    capabilities: [result, container-shape, mapping]
    anchor: { method: mapping_shape, selector: fetch, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE]
      receiver_type: Hash
      result_type: Hash
      result_shape: mapping

  - id: record_result_shape
    capabilities: [result, container-shape, record]
    anchor: { method: record_shape, selector: fetch, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE]
      receiver_type: Hash
      result_type: RuntimeEvidenceConformance::Generated
      result_shape: record

  - id: boolean_predicate
    capabilities: [boolean-result, branch-predicate]
    anchor: { method: predicate, selector: respond_to?, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET, BOOLEAN_RESULT]
      receiver_type: RuntimeEvidenceConformance::Value
      boolean_result: true

  - id: false_boolean_predicate
    capabilities: [boolean-result, false-value, branch-predicate]
    anchor: { method: false_predicate, selector: respond_to?, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET, BOOLEAN_RESULT]
      receiver_type: RuntimeEvidenceConformance::Value
      boolean_result: false

  - id: repeated_exact_call
    capabilities: [repeated-execution, execution-count, exact-anchor]
    anchor: { method: repeated_call, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize
      observed_executions: 3

  - id: subprocess_result
    capabilities: [subprocess, result-object, native-call]
    anchor: { method: subprocess_result, selector: success?, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: Process::Status
      target_owner: Process::Status
      target_name: success?

  - id: mixed_production_and_test_replacement
    capabilities: [test-replacement, mixed-provenance, transparent-wrapper]
    anchor: { method: mixed_provenance_status, selector: success?, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: Process::Status
      target_owner: Process::Status
      target_name: success?
      source_role: STANDARD_LIBRARY
      excluded_target_owner: RuntimeEvidenceConformance::TestStatus

  - id: mixed_generated_accessor_replacement
    capabilities: [test-replacement, mixed-provenance, generated-accessor, transparent-wrapper]
    anchor: { method: mixed_generated_accessor, selector: decision_line, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::GeneratedStatus
      target_owner: RuntimeEvidenceConformance::GeneratedStatus
      target_name: decision_line
      source_role: PRODUCTION
      excluded_target_owner: RuntimeEvidenceConformance::TestGeneratedStatus

  - id: result_call_after_replaced_producer
    capabilities: [test-replacement, mixed-provenance, resumed-production-frame, result-object]
    anchor: { method: status_after_capture, selector: success?, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: Process::Status
      target_owner: Process::Status
      target_name: success?
      source_role: STANDARD_LIBRARY
      excluded_target_owner: RuntimeEvidenceConformance::TestStatus

  - id: exception_target
    capabilities: [exception, non-returning-call, partial-result]
    anchor: { method: exception_flow, selector: fail!, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Raiser
      target_owner: RuntimeEvidenceConformance::Raiser

  - id: exception_missing_result
    capabilities: [exception, non-returning-call, partial-result, per-kind-completeness]
    anchor: { method: exception_result_flow, selector: fail!, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE]
      allowed_status: PARTIAL
      complete_kinds: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Raiser
      target_owner: RuntimeEvidenceConformance::Raiser
      target_name: fail!

  - id: uncaught_exception_target
    capabilities: [exception, non-returning-call, failed-return]
    anchor: { method: uncaught_exception_flow, selector: fail!, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Raiser
      target_owner: RuntimeEvidenceConformance::Raiser

  - id: nonproduction_target
    capabilities: [dynamic-dispatch, test-replacement, nonproduction-provenance]
    anchor: { method: replaced_dispatch, selector: dispatch, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::TestDispatcher
      target_owner: RuntimeEvidenceConformance::TestDispatcher
      source_role: NON_PRODUCTION

  - id: state_value_dispatch
    capabilities: [state-read, state-write, state-value, cfg, dfg]
    anchor: { method: state_flow, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize
      source_role: PRODUCTION

  - id: state_receiver_dispatch
    capabilities: [state-read, state-write, state-value, receiver-from-state, cfg, dfg]
    anchor: { method: state_receiver_flow, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize
      source_role: PRODUCTION

  - id: chained_result_dispatch
    capabilities: [chained-call, nested-receiver, result-flow, callback-origin]
    anchor: { method: chained_result_flow, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize

  - id: rescued_exception_value
    capabilities: [exception, rescue-binding, native-call]
    anchor: { method: exception_value_flow, selector: message, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeError
      target_owner: Exception
      target_name: message
      source_role: STANDARD_LIBRARY

  - id: dependency_target
    capabilities: [dependency-provenance, third-party-target]
    anchor: { method: dependency_call, selector: diff, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: Module
      target_owner: Diff::LCS
      target_name: diff
      source_role: DEPENDENCY

boundary_cases:
  - id: parameter_value
    capabilities: [function-entry, parameter-value]
    method: exact_call
    display_name: value
    anchor_kind: FUNCTION_ENTRY
    evidence_kind: PARAMETER_VALUE
    expected_type: RuntimeEvidenceConformance::Value

  - id: return_value
    capabilities: [function-return, return-value]
    method: exact_call
    display_name: return
    anchor_kind: FUNCTION_RETURN
    evidence_kind: RETURN_VALUE
    expected_type: String

  - id: nil_return_value
    capabilities: [function-return, return-value, nil-value]
    method: nil_return
    display_name: return
    anchor_kind: FUNCTION_RETURN
    evidence_kind: RETURN_VALUE
    expected_type: NilClass

  - id: state_write_value
    capabilities: [state-write, state-value]
    method: state_flow
    display_name: state
    anchor_kind: STATE_WRITE
    evidence_kind: STATE_VALUE
    expected_type: RuntimeEvidenceConformance::Value

  - id: uncaught_function_return
    capabilities: [function-return, exception, non-returning-call, failed-return]
    method: uncaught_exception_flow
    display_name: return
    anchor_kind: FUNCTION_RETURN
    evidence_kind: RETURN_VALUE
    allowed_status: NOT_EXECUTED

merge_cases:
  - id: repeated_runs_are_additive
    capabilities: [repeated-run, sharded-run, merge]
    expected_runs: [run-a, run-b]
    expected_count: 2

  - id: changed_shard_replaces_owned_evidence
    capabilities: [incremental, replacement, stale-source]
    expected_runs: [run-new]
    forbidden_runs: [run-old]
