{% extends "base.html" %}
{% block content %}
<section class="intro">
  <h1>{{ section.title }}</h1>
  {{ section.content | safe }}
</section>
{% set blog = get_section(path="blog/_index.md") %}
<ul class="post-list">
{% for page in blog.pages %}
  <li>
    <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
    <time datetime="{{ page.date }}">{{ page.date }}</time>
  </li>
{% endfor %}
</ul>
{% endblock content %}
