{% extends "base.html" %}
{% block title %}{{ section.title }} — {{ config.title }}{% endblock title %}
{% block content %}
<h1>{{ section.title }}</h1>
<ul class="post-list">
{% for page in section.pages %}
  <li>
    <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
    <time datetime="{{ page.date }}">{{ page.date }}</time>
  </li>
{% endfor %}
</ul>
{% endblock content %}
