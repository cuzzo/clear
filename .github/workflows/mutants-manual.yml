name: Manual mutants

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "PR head ref to mutant test: full SHA, short SHA, branch, or tag"
        required: true
        type: string
      base_sha:
        description: "Base SHA for Ruby --since filtering; leave blank to use the associated PR base SHA when available"
        required: false
        type: string
      head_repository:
        description: "Repository containing the head SHA; leave blank for this repository"
        required: false
        type: string
      ruby_shards:
        description: "Ruby spec mutant shard count"
        required: true
        default: "32"
        type: string
      fuzz_shards:
        description: "Fuzz mutant shard count"
        required: true
        default: "8"
        type: string
      transpile_shards:
        description: "Transpile mutant shard count"
        required: true
        default: "5"
        type: string

concurrency:
  group: mutants-manual-${{ inputs.sha }}
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.16.0"
  RUBY_VERSION: "3.2"
  COVERAGE: "0"

jobs:
  resolve_ref:
    name: Resolve mutant target ref
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_repository: ${{ steps.resolve.outputs.head_repository }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_REF: ${{ inputs.sha }}
          INPUT_REPOSITORY: ${{ inputs.head_repository }}
        run: |
          set -euo pipefail

          repo="${INPUT_REPOSITORY:-${GITHUB_REPOSITORY}}"
          ref="${INPUT_REF}"
          work="$(mktemp -d)"

          git -C "${work}" init -q
          git -C "${work}" remote add origin "https://github.com/${repo}.git"

          if [[ "${ref}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            git -C "${work}" fetch --no-tags --depth=1 origin "${ref}"
            resolved="$(git -C "${work}" rev-parse FETCH_HEAD^{commit})"
          elif [[ "${ref}" =~ ^[0-9a-fA-F]{7,39}$ ]]; then
            git -C "${work}" fetch --filter=blob:none --no-tags --prune origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*'
            mapfile -t matches < <(git -C "${work}" rev-list --all | grep -i "^${ref}")
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'Expected short SHA %s to resolve to exactly one commit, found %s\n' "${ref}" "${#matches[@]}" >&2
              exit 1
            fi
            resolved="${matches[0]}"
          else
            git -C "${work}" fetch --no-tags --depth=1 origin "${ref}"
            resolved="$(git -C "${work}" rev-parse FETCH_HEAD^{commit})"
          fi

          base_sha="${INPUT_BASE_SHA}"
          if [ -z "${base_sha}" ] && [ "${repo}" = "${GITHUB_REPOSITORY}" ]; then
            base_sha="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${resolved}/pulls" \
                --jq '.[0].base.sha // ""'
            )"
          fi

          {
            echo "base_sha=${base_sha}"
            echo "head_repository=${repo}"
            echo "head_sha=${resolved}"
          } >> "${GITHUB_OUTPUT}"

  mark-pending:
    name: Mark mutants/manual pending
    runs-on: ubuntu-latest
    needs: resolve_ref
    permissions:
      statuses: write
    steps:
      - name: Set pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve_ref.outputs.head_sha }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=pending \
            -f context='mutants/manual' \
            -f description='Manual mutant gate is running' \
            -f target_url="${TARGET_URL}"

  plan:
    name: Build shard matrices
    runs-on: ubuntu-latest
    outputs:
      ruby_matrix: ${{ steps.matrix.outputs.ruby_matrix }}
      fuzz_matrix: ${{ steps.matrix.outputs.fuzz_matrix }}
      transpile_matrix: ${{ steps.matrix.outputs.transpile_matrix }}
    steps:
      - id: matrix
        env:
          RUBY_SHARDS: ${{ inputs.ruby_shards }}
          FUZZ_SHARDS: ${{ inputs.fuzz_shards }}
          TRANSPILE_SHARDS: ${{ inputs.transpile_shards }}
        run: |
          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          require "json"

          def matrix(env_name)
            count = Integer(ENV.fetch(env_name))
            raise "#{env_name} must be between 1 and 64" unless count.between?(1, 64)

            { include: count.times.map { |index| { shard: index, count: count } } }
          end

          puts "ruby_matrix=#{JSON.generate(matrix("RUBY_SHARDS"))}"
          puts "fuzz_matrix=#{JSON.generate(matrix("FUZZ_SHARDS"))}"
          puts "transpile_matrix=#{JSON.generate(matrix("TRANSPILE_SHARDS"))}"
          RUBY

  ruby-spec-mutants:
    name: Ruby spec mutants shard ${{ matrix.shard }}/${{ matrix.count }}
    runs-on: ubuntu-latest
    needs: [resolve_ref, plan]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.ruby_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve_ref.outputs.head_repository }}
          ref: ${{ needs.resolve_ref.outputs.head_sha }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Run Ruby spec mutants
        env:
          BASE_SHA: ${{ needs.resolve_ref.outputs.base_sha }}
        run: |
          args=(--shard "${{ matrix.shard }}/${{ matrix.count }}" --out "/tmp/clear-ruby-mutants-${{ matrix.shard }}")
          if [ -n "${BASE_SHA}" ]; then
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || \
              git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "${BASE_SHA}"
            args+=(--since "${BASE_SHA}")
          fi
          MUTANT_JOBS="$(nproc)" bundle exec ruby gems/gigasail/tools/mutant-converters/ruby_mutant.rb "${args[@]}"
          # Store facts compressed (giga ingest-mutants reads .gz transparently).
          facts="/tmp/clear-ruby-mutants-${{ matrix.shard }}/mutant-facts.json"
          [ -f "$facts" ] && gzip -f "$facts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruby-mutant-facts-${{ matrix.shard }}
          path: |
            /tmp/clear-ruby-mutants-${{ matrix.shard }}/mutant-facts.json.gz
            /tmp/clear-ruby-mutants-${{ matrix.shard }}/*.log
          if-no-files-found: warn
          retention-days: 14

  fuzz-mutants:
    name: Fuzz mutants shard ${{ matrix.shard }}/${{ matrix.count }}
    runs-on: ubuntu-latest
    needs: [resolve_ref, plan]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.fuzz_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve_ref.outputs.head_repository }}
          ref: ${{ needs.resolve_ref.outputs.head_sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: bundle exec ruby tools/fuzz/mutants/run.rb --all --shard ${{ matrix.shard }}/${{ matrix.count }} --out /tmp/clear-fuzz-mutants-${{ matrix.shard }}

  transpile-mutants:
    name: Transpile mutants shard ${{ matrix.shard }}/${{ matrix.count }}
    runs-on: ubuntu-latest
    needs: [resolve_ref, plan]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.transpile_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve_ref.outputs.head_repository }}
          ref: ${{ needs.resolve_ref.outputs.head_sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: bundle exec ruby tools/mutants/transpile_tests.rb --all --shard ${{ matrix.shard }}/${{ matrix.count }} --out /tmp/clear-transpile-mutants-${{ matrix.shard }}

  complete:
    name: mutants/manual
    runs-on: ubuntu-latest
    needs: [resolve_ref, mark-pending, ruby-spec-mutants, fuzz-mutants, transpile-mutants]
    if: always()
    permissions:
      statuses: write
    steps:
      - name: Set final status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve_ref.outputs.head_sha }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUBY_RESULT: ${{ needs.ruby-spec-mutants.result }}
          FUZZ_RESULT: ${{ needs.fuzz-mutants.result }}
          TRANSPILE_RESULT: ${{ needs.transpile-mutants.result }}
        run: |
          state=success
          description='Manual mutant gate passed'
          if [ "${RUBY_RESULT}" != "success" ] || [ "${FUZZ_RESULT}" != "success" ] || [ "${TRANSPILE_RESULT}" != "success" ]; then
            state=failure
            description='Manual mutant gate failed'
          fi

          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" \
            -f context='mutants/manual' \
            -f description="${description}" \
            -f target_url="${TARGET_URL}"

          test "${state}" = "success"
