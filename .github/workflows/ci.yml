      - tools-fuzz-shard
    if: ${{ always() && needs.changes.outputs.run_src == 'true' }}
    steps:
      - name: Require every fuzz shard
        run: |
          if [ "${{ needs.tools-fuzz-shard.result }}" != "success" ]; then
            echo "tools/fuzz shard matrix result: ${{ needs.tools-fuzz-shard.result }}"
            exit 1
          fi
          echo "all tools/fuzz shards passed"

  bc-lower-coverage-shard:
    name: bc-lowering coverage shard ${{ matrix.shard }}/5
    needs: changes
    if: ${{ needs.changes.outputs.run_src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      COVERAGE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      # Pure Ruby: re-lowers the existing .clear corpus with target: :bc
      # to cover the @target==:bc lowering arms. No Zig / no clear build
      # (lowering runs before the bytecode VM; the incomplete _bc_runner
      # is never executed).
      - run: bundle exec ruby tools/bc_lower_coverage.rb --shard ${{ matrix.shard }}/5
      - run: bundle exec ruby compiler/spec/collate_coverage.rb
      - uses: actions/upload-artifact@v4
        with:
