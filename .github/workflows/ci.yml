name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same branch when a
# new commit lands. Keeps queue depth low for rapid-fire pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  RUBY_VERSION: "3.2"
  # Default off — most jobs skip the SimpleCov instrumentation overhead.
  # ruby-unit overrides this to "1" so its run drops a Cobertura XML
  # for codecov-action to pick up.
  COVERAGE: "0"

jobs:
  changes:
    name: CI change scope
    runs-on: ubuntu-latest
    outputs:
      run_gems: ${{ steps.pr_scope.outputs.run_gems || steps.push_scope.outputs.run_gems || steps.full.outputs.run_gems }}
      run_src: ${{ steps.pr_scope.outputs.run_src || steps.push_scope.outputs.run_src || steps.full.outputs.run_src }}
      run_zig: ${{ steps.pr_scope.outputs.run_zig || steps.push_scope.outputs.run_zig || steps.full.outputs.run_zig }}
    steps:
      # Fetch the comparison commit for both PRs and ordinary pushes. Pushes
      # used to bypass the path classifier and force every CI lane on, so a
      # gem-only change still ran compiler coverage, benchmarks, and Zig jobs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: full
        # A first push has no parent SHA to diff. Keep the conservative full
        # run for that unusual case only.
        if: github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000'
        run: |
          echo "run_gems=true" >> "$GITHUB_OUTPUT"
          echo "run_src=true" >> "$GITHUB_OUTPUT"
          echo "run_zig=true" >> "$GITHUB_OUTPUT"
      - id: pr_scope
        if: github.event_name == 'pull_request'
        run: ruby tools/ci_change_scopes.rb --base "${{ github.event.pull_request.base.sha }}"
      - id: push_scope
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: ruby tools/ci_change_scopes.rb --base "${{ github.event.before }}"

  mutants-manual-pending:
    name: mutants/manual pending
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Mark manual mutant gate status
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_MUTANTS: ${{ needs.changes.outputs.run_gems == 'true' || needs.changes.outputs.run_src == 'true' || needs.changes.outputs.run_zig == 'true' }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/workflows/mutants-manual.yml
        run: |
          state=success
          description='No mutant gate needed for markdown-only changes'
          if [ "${NEEDS_MUTANTS}" = "true" ]; then
            state=pending
            description='Run Manual mutants before merge'
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state="${state}" \
            -f context='mutants/manual' \
            -f description="${description}" \
            -f target_url="${TARGET_URL}"

  ruby-unit:
    name: Ruby unit specs (parallel, no integration)
    needs: changes
    if: ${{ needs.changes.outputs.run_src == 'true' }}
    runs-on: ubuntu-latest
    env:
      COVERAGE: "1"  # SimpleCov writes coverage/coverage.xml for Codecov upload below
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec prspec compiler/spec/
      # Collate parallel_rspec workers' resultsets into a single Cobertura
      # XML before upload (each worker writes its own `RSpec-w<id>-<pid>`
      # entry into coverage/.resultset.json; collate_coverage merges them
      # back into one entry that the Cobertura formatter understands).
      - run: bundle exec ruby compiler/spec/collate_coverage.rb
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-coverage-unit
          path: |
            coverage/.resultset.json
            coverage/coverage.xml
          include-hidden-files: true
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.xml
          disable_search: true
          flags: ruby
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  nil-kill-unit:
    name: nil-kill gem specs
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    env:
      COVERAGE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tree-sitter grammars
        run: npm install --legacy-peer-deps
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust binaries
        run: |
          cargo build --release --manifest-path gems/fact-mine/Cargo.toml
          cargo build --release --manifest-path gems/nil-kill/Cargo.toml
      - run: bundle exec rspec gems/nil-kill/spec
        env:
          FACT_MINE_RUST_BINARY: ./gems/fact-mine/target/release/fact-mine-rust
          NIL_KILL_INFER_RUST_BINARY: ./gems/nil-kill/target/release/nil-kill-infer-rust

  test-miser-checkpoint:
    name: Test Miser corpus and runner integration
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest oracle fixture runtime
        run: python -m pip install --disable-pip-version-check pytest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Jest oracle fixture runtime
        run: npm install --no-save --no-package-lock jest@30.0.5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Lineage release binary
        # The ingestion round-trip test below skips silently (not fails)
        # when this binary is absent, so without this step CI could report
        # green while that contract was never actually exercised.
        run: cargo build --release --manifest-path gems/lineage/Cargo.toml
      - name: Verify runner adapters, dynamic planning, and canonical checkpoints
        run: bundle exec ruby -I gems/test-miser/test gems/test-miser/test/test_miser_test.rb
      - name: Verify PR step summary tallies
        run: bundle exec ruby -I gems/test-miser/test gems/test-miser/test/step_summary_test.rb
      - name: Verify Lineage corpus ingestion round-trip
        run: bundle exec ruby -I gems/test-miser/test gems/test-miser/test/lineage_ingest_integration_test.rb
      - name: Verify Test Miser evidence analyzers and product formats
        run: |
          bundle exec ruby -I gems/test-miser/test -e '
            require "simplecov";
            SimpleCov.start do
              enable_coverage :branch;
              track_files "gems/test-miser/lib/test_miser/evidence/**/*.rb";
              minimum_coverage 95;
            end;
            Dir["gems/test-miser/test/evidence_*_test.rb"].sort.each { |file| require File.expand_path(file) }
          '

  boobytrap-go-unit:
    name: boobytrap Go tests
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: gems/boobytrap/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tree-sitter grammars
        run: npm install --legacy-peer-deps
      - run: bundle exec go test -v -coverprofile=coverage.raw.txt -covermode=atomic ./...
        working-directory: gems/boobytrap
      - name: Normalize Boobytrap Go coverage paths
        run: |
          ruby -e 'ARGV.each { |path| text = File.read(path); File.write(path.sub(".raw.", "."), text.gsub(/^boobytrap-helper\//, "gems/boobytrap/")) }' \
            gems/boobytrap/coverage.raw.txt
      - uses: codecov/codecov-action@v5
        with:
          files: gems/boobytrap/coverage.txt
          disable_search: true
          flags: go
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  ruby-gems-coverage:
    name: Ruby gems coverage
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    env:
      COVERAGE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tree-sitter grammars
        run: npm install --legacy-peer-deps
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust binaries
        # gems/slopcop/test/cross_gem_contract_integration_test.rb and
        # gems/espalier/test/architecture_tools_test.rb both exercise the
        # Lineage binary; building it here is required, not optional - the
        # SlopCop test hard-flunks without it (this job would otherwise be
        # broken), and the Espalier one silently skips without it (so its
        # contract would go untested with no visible failure).
        run: |
          cargo build --release --manifest-path gems/fact-mine/Cargo.toml
          cargo build --release --manifest-path gems/nil-kill/Cargo.toml
          cargo build --release --manifest-path gems/decomplex/Cargo.toml
          cargo build --release --manifest-path gems/lineage/Cargo.toml
      - name: Run Ruby gem tests with SimpleCov
        run: bundle exec ruby tools/run_ruby_gem_coverage.rb
        env:
          # Absolute paths: cross_gem_contract_integration_test.rb (and other
          # integration tests it runs) Dir.chdir into a temp fixture
          # directory before invoking these binaries as subprocesses, so a
          # relative path here resolves against the wrong cwd and fails with
          # "command not found" (exit 127) once that chdir happens.
          FACT_MINE_RUST_BINARY: ${{ github.workspace }}/gems/fact-mine/target/release/fact-mine-rust
          NIL_KILL_INFER_RUST_BINARY: ${{ github.workspace }}/gems/nil-kill/target/release/nil-kill-infer-rust
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-coverage-gems
          path: |
            coverage/ruby-gems/.resultset.json
            coverage/ruby-gems/coverage.xml
          include-hidden-files: true
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/ruby-gems/coverage.xml
          disable_search: true
          flags: gems
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  zig-mutants-coverage:
    name: zig-mutants coverage
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kcov-bin
          key: kcov-v43-${{ runner.os }}
      - name: Install kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev libdw-dev binutils-dev libiberty-dev libelf-dev
          git clone --depth=1 --branch v43 https://github.com/SimonKagstrom/kcov.git
          cd kcov && mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/kcov-bin ..
          make -j$(nproc) && make install
      - name: Add kcov to PATH
        run: echo "${{ github.workspace }}/kcov-bin/bin" >> $GITHUB_PATH
      - name: Run zig-mutants coverage
        working-directory: gems/zig-mutants
        run: zig build coverage -Dcoverage
      - name: Normalize zig-mutants Cobertura paths
        run: |
          xml="$(find gems/zig-mutants/zig-out/coverage/kcov -name cobertura.xml -type f | sort | head -n 1)"
          test -n "$xml"
          mkdir -p tmp/zig-mutants-coverage
          ruby -rrexml/document -e '
            repo = File.expand_path(".")
            xml = ARGV.fetch(0)
            out = ARGV.fetch(1)
            doc = REXML::Document.new(File.read(xml))
            REXML::XPath.each(doc, "//class") do |klass|
              filename = klass.attributes["filename"].to_s.tr("\\\\", "/")
              rel = if filename.start_with?(repo.tr("\\\\", "/") + "/")
                      filename[(repo.length + 1)..]
                    elsif filename.start_with?("compiler/ruby/")
                      "gems/zig-mutants/#{filename}"
                    else
                      filename
                    end
              klass.attributes["filename"] = rel
            end
            File.write(out, "")
            File.open(out, "w") { |f| doc.write(f, 2) }
          ' "$xml" tmp/zig-mutants-coverage/cobertura.xml
      - uses: actions/upload-artifact@v4
        with:
          name: zig-coverage-zig-mutants
          path: tmp/zig-mutants-coverage/cobertura.xml
          if-no-files-found: error
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./tmp/zig-mutants-coverage/cobertura.xml
          disable_search: true
          flags: zig-mutants
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lineage-rust-coverage:
    name: Lineage Rust coverage
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run cargo llvm-cov for Lineage
        run: |
          mkdir -p tmp/lineage-rust-coverage
          cargo llvm-cov \
            --manifest-path gems/lineage/Cargo.toml \
            --all-features \
            --cobertura \
            --output-path ${{ github.workspace }}/tmp/lineage-rust-coverage/cobertura.xml
      - uses: actions/upload-artifact@v4
        with:
          name: lineage-rust-coverage
          path: tmp/lineage-rust-coverage/cobertura.xml
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./tmp/lineage-rust-coverage/cobertura.xml
          disable_search: true
          flags: lineage-rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sql-cov-dialects:
    name: SQL-COV SQLite / PostgreSQL / MySQL plans
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sql_cov
          POSTGRES_PASSWORD: sql_cov
          POSTGRES_DB: sql_cov
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sql_cov -d sql_cov"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sql_cov
          MYSQL_DATABASE: sql_cov
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -psql_cov"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      SQL_COV_POSTGRES_URL: postgres://sql_cov:sql_cov@127.0.0.1:5432/sql_cov
      SQL_COV_MYSQL_URL: mysql://root:sql_cov@127.0.0.1:3306/sql_cov
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all SQL-COV tests against all supported databases
        run: cargo test --manifest-path gems/sql-cov/Cargo.toml --all-targets

  decomplex-rust-test:
    name: Decomplex Rust tests
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Decomplex tests
        run: cargo test --manifest-path gems/decomplex/Cargo.toml

  fact-mine-rust-coverage:
    name: FactMine Rust coverage
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Install tree_sitter gem
        run: gem install tree_sitter
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tree-sitter grammars
        run: npm install --legacy-peer-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run cargo llvm-cov for FactMine
        run: |
          mkdir -p tmp/fact-mine-rust-coverage
          cargo llvm-cov clean --manifest-path gems/fact-mine/Cargo.toml
          cargo llvm-cov --no-report --manifest-path gems/fact-mine/Cargo.toml --all-features
          cargo build --release --manifest-path gems/fact-mine/Cargo.toml
          cargo build --release --manifest-path gems/nil-kill/Cargo.toml
          cargo build --release --manifest-path gems/decomplex/Cargo.toml
          cargo build --release --manifest-path gems/lineage/Cargo.toml
          FACT_MINE_RUST_BINARY=${{ github.workspace }}/gems/fact-mine/target/llvm-cov-target/debug/fact-mine-rust \
          NIL_KILL_INFER_RUST_BINARY=${{ github.workspace }}/gems/nil-kill/target/release/nil-kill-infer-rust \
          DECOMPLEX_RUST_BINARY=${{ github.workspace }}/gems/decomplex/target/release/decomplex-rust \
          LLVM_PROFILE_FILE='${{ github.workspace }}/gems/fact-mine/target/llvm-cov-target/fact-mine-%p-%32m.profraw' \
          bundle exec ruby tools/run_ruby_gem_coverage.rb
          cargo llvm-cov report \
            --manifest-path gems/fact-mine/Cargo.toml \
            --cobertura \
            --output-path ${{ github.workspace }}/tmp/fact-mine-rust-coverage/cobertura.xml
      - uses: actions/upload-artifact@v4
        with:
          name: fact-mine-rust-coverage
          path: tmp/fact-mine-rust-coverage/cobertura.xml
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./tmp/fact-mine-rust-coverage/cobertura.xml
          disable_search: true
          flags: fact-mine-rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  nil-kill-rust-coverage:
    name: Nil-Kill Rust coverage
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run cargo llvm-cov for Nil-Kill
        run: |
          mkdir -p tmp/nil-kill-rust-coverage
          cargo llvm-cov \
            --manifest-path gems/nil-kill/Cargo.toml \
            --all-features \
            --cobertura \
            --output-path ${{ github.workspace }}/tmp/nil-kill-rust-coverage/cobertura.xml
      - uses: actions/upload-artifact@v4
        with:
          name: nil-kill-rust-coverage
          path: tmp/nil-kill-rust-coverage/cobertura.xml
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./tmp/nil-kill-rust-coverage/cobertura.xml
          disable_search: true
          flags: nil-kill-rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}


  decomplex-rust-coverage:
    name: Decomplex Rust coverage
    needs: changes
    if: ${{ needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Install tree_sitter gem
        run: gem install tree_sitter
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tree-sitter Ruby grammar
        run: npm install --no-save --package-lock=false tree-sitter-ruby@0.23.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run cargo llvm-cov for Decomplex
        run: |
          mkdir -p tmp/decomplex-rust-coverage
          cargo llvm-cov \
            --manifest-path gems/decomplex/Cargo.toml \
            --all-features \
            --cobertura \
            --output-path ${{ github.workspace }}/tmp/decomplex-rust-coverage/cobertura.xml
      - uses: actions/upload-artifact@v4
        with:
          name: decomplex-rust-coverage
          path: tmp/decomplex-rust-coverage/cobertura.xml
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./tmp/decomplex-rust-coverage/cobertura.xml
          disable_search: true
          flags: decomplex-rust
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  sorbet:
    name: Sorbet type-check (typed:true files only)
    needs: changes
    if: ${{ needs.changes.outputs.run_src == 'true' || needs.changes.outputs.run_gems == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Verify clear-attr-accessors.rbi is up to date
        run: |
          bundle exec ruby tools/gen_attr_rbi.rb > /tmp/rbi-check.rbi 2>/dev/null
          diff sorbet/rbi/clear-attr-accessors.rbi /tmp/rbi-check.rbi \
            || (echo "RBI is stale. Run: bundle exec ruby tools/gen_attr_rbi.rb > sorbet/rbi/clear-attr-accessors.rbi" && exit 1)
      - run: bundle exec srb tc
        env:
          SRB_YES: "1"
          NO_COLOR: "1"

  rubocop-signatures:
    name: Rubocop Sorbet/EnforceSignatures
    needs: changes
    if: ${{ needs.changes.outputs.run_src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec rubocop --only Sorbet/EnforceSignatures compiler/ruby/

  lint-sarif:
    name: Advisory lint SARIF
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.changes.outputs.run_src == 'true' || needs.changes.outputs.run_gems == 'true' || needs.changes.outputs.run_zig == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup component add clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Generate lint SARIF
        run: |
          git fetch origin "+${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          timeout 10m bundle exec ruby tools/generate_lint_sarif.rb \
            --repo=. \
            --base="origin/${{ github.event.pull_request.base.ref }}" \
            --head=HEAD \
            --out-dir=tmp/lint-sarif
      - name: Upload RuboCop SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/lint-sarif/rubocop.sarif
          category: rubocop-lint
      - name: Upload Clippy SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/lint-sarif/clippy.sarif
          category: clippy-lint
      - name: Upload Zig AST Check SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/lint-sarif/zig-ast-check.sarif
          category: zig-ast-check
      - uses: actions/upload-artifact@v4
        with:
          name: lint-sarif
          path: tmp/lint-sarif/*.sarif
          if-no-files-found: error
          retention-days: 7

  ruby-integration:
    name: Ruby integration specs (builds binaries via clear)
    needs: changes
    if: ${{ needs.changes.outputs.run_src == 'true' }}
    runs-on: ubuntu-latest
    env:
      COVERAGE: "1"  # Picked up by spec_helper + clear-CLI's coverage_bootstrap;
                     # makes integration-only files (clear_bin_spec, clear_fix_spec,
                     # vm_bg_capture, etc.) contribute to the Ruby flag on Codecov.
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Cache clear's per-source build dirs + transpiled .zig outputs.
      # Each `./clear build` keys the cache off the source path SHA, so
      # every fresh tmp dir in clear_bin_spec hits cold. Persisting these
      # caches across CI runs (keyed on src/ + zig/runtime/ + zig/lib/
      # + Gemfile.lock + zig version) means subsequent pushes start
      # warm. Restore-keys gives a partial hit when only some inputs
      # change.
      - uses: actions/cache@v4
        with:
          path: |
            zig/.clear-cache
            zig/.clear-transpile-cache
          key: clear-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('compiler/ruby/**', 'zig/runtime/**', 'zig/lib/**', 'Gemfile.lock') }}
          restore-keys: |
            clear-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-
      - run: bundle exec prspec compiler/spec/ --tag integration
      # Collate workers + clear-CLI subprocess resultsets into a single
      # Cobertura XML, same as the unit job. Both unit and integration
      # uploads use `flags: ruby` so Codecov merges them server-side
      # into one Ruby coverage view.
      - run: bundle exec ruby compiler/spec/collate_coverage.rb
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-coverage-integration
          path: coverage/.resultset.json
          include-hidden-files: true
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.xml
          disable_search: true
          flags: ruby
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  transpile-tests:
    name: transpile-tests/ coverage (.clear via gen.rb)
    needs: changes
    if: ${{ needs.changes.outputs.run_src == 'true' }}
    runs-on: ubuntu-22.04
    env:
      COVERAGE: "1"
      COVERAGE_ISOLATED: "1"
      ZIG_COVERAGE: "1"
      ZIG_COVERAGE_SUITE: "transpile-tests"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kcov-bin
          key: kcov-v43-${{ runner.os }}
      - name: Install kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev libdw-dev binutils-dev libiberty-dev libelf-dev
          git clone --depth=1 --branch v43 https://github.com/SimonKagstrom/kcov.git
          cd kcov && mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/kcov-bin ..
          make -j$(nproc) && make install
      - name: Add kcov to PATH
        run: echo "${{ github.workspace }}/kcov-bin/bin" >> $GITHUB_PATH
      # Ruby coverage records compile/lowering/emission. ZIG_COVERAGE=1 also
      # runs the generated all-tests.zig bundle under kcov so this suite
      # contributes runtime/lib Zig coverage without spawning per-file clear
      # subprocesses.
      - uses: actions/cache@v4
        with:
          path: |
            zig/.clear-cache
            zig/.clear-transpile-cache
          key: clear-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('compiler/ruby/**', 'zig/runtime/**', 'zig/lib/**', 'Gemfile.lock') }}
          restore-keys: |
            clear-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-
      - run: TRANSPILE_GEN_JOBS="$(nproc)" bundle exec ruby transpile-tests/gen.rb
      - run: bundle exec ruby compiler/spec/collate_coverage.rb
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-coverage-transpile-tests
          path: coverage/.resultset.json
          include-hidden-files: true
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.xml
          disable_search: true
          flags: ruby,transpile-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: zig-coverage-transpile-tests
          path: zig/zig-out/coverage-transpile-tests/merged/kcov-merged/cobertura.xml
          if-no-files-found: error
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./zig/zig-out/coverage-transpile-tests/merged/kcov-merged/cobertura.xml
          disable_search: true
          flags: zig,transpile-tests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

