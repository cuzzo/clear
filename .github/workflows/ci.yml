      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kcov-bin
          key: kcov-v43-${{ runner.os }}
      - name: Install kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev libdw-dev binutils-dev libiberty-dev libelf-dev
          git clone --depth=1 --branch v43 https://github.com/SimonKagstrom/kcov.git
          cd kcov && mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/kcov-bin ..
          make -j$(nproc) && make install
      - name: Add kcov to PATH
        run: echo "${{ github.workspace }}/kcov-bin/bin" >> $GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: |
            zig/.clear-cache
            zig/.clear-transpile-cache
          key: clear-fuzz-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('compiler/ruby/**', 'zig/runtime/**', 'zig/lib/**', 'tools/fuzz/**', 'Gemfile.lock') }}
          restore-keys: |
            clear-fuzz-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-
      # Ruby coverage records compile/lower/emit. ZIG_COVERAGE=1 also bundles
      # positive fuzz cells and runs that Zig test root under kcov; negative
      # cells stay compile-only so SimpleCov does not fan out through every
      # child `clear test` / `clear build` process.
      - run: bundle exec ruby tools/fuzz/run.rb --matrix --shard ${{ matrix.shard }}/5 --out /tmp/clear-fuzz-ci-${{ matrix.shard }} --clean --jobs "$(nproc)"
      - run: bundle exec ruby compiler/spec/collate_coverage.rb
