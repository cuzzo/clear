      - working-directory: transpile-tests/ffi-integration
        run: zig build test

  benchmark-leak:
    # Leak-mode benchmark CI compiles every CLEAR benchmark in debug/GPA
    # mode and runs a reduced workload. It does not compare timings; it
    # catches benchmark-only leaks and debug-mode runtime wiring issues
    # that unit/transpile tests do not exercise.
    name: Benchmark leak checks (shard ${{ matrix.shard }}/5)
    needs: changes
    if: ${{ needs.changes.outputs.run_src == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write
    env:
      BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
      BENCHER_TESTBED: ${{ vars.BENCHER_TESTBED }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            zig/.clear-cache
            zig/.clear-transpile-cache
          key: clear-bench-leak-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('compiler/ruby/**', 'zig/runtime/**', 'zig/lib/**', 'benchmarks/**/*.clear', 'Gemfile.lock') }}
          restore-keys: |
            clear-bench-leak-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-
      - run: ruby benchmarks/runner.rb --leak --all --shard=${{ matrix.shard }}/5 --cores=2 --bencher-json tmp/benchmark-leak-${{ matrix.shard }}.json
      - name: Validate Bencher JSON
        run: |
          ruby -rjson -e '
            path = "tmp/benchmark-leak-${{ matrix.shard }}.json"
            data = JSON.parse(File.read(path))
            abort("Bencher JSON is empty") if data.empty?
            data.each do |benchmark, measures|
              abort("Bencher benchmark #{benchmark.inspect} has no measures") unless measures.is_a?(Hash) && !measures.empty?
              measures.each do |measure, payload|
                value = payload["value"]
                abort("Bencher measure #{benchmark}/#{measure} missing numeric value") unless value.is_a?(Numeric)
              end
            end
          '
      - uses: bencherdev/bencher@main
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Upload leak benchmark shard to Bencher
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCHER_JSON: tmp/benchmark-leak-${{ matrix.shard }}.json
        run: |
          testbed="${BENCHER_TESTBED:-ubuntu-latest}"
          project="${BENCHER_PROJECT:-clear}"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

          args=(
            --project "$project"
            --token "$BENCHER_API_TOKEN"
            --branch "$branch"
            --testbed "$testbed"
            --adapter json
            --file "$BENCHER_JSON"
            --err
          )

          if [ "${{ matrix.shard }}" = "0" ]; then
            args+=(
              --github-actions "$GITHUB_TOKEN"
              --ci-id "benchmark-leak"
            )
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              args+=(--ci-number "${{ github.event.pull_request.number }}")
            fi
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            args+=(
              --start-point "$GITHUB_BASE_REF"
              --start-point-hash "${{ github.event.pull_request.base.sha }}"
              --start-point-clone-thresholds
              --start-point-reset
            )
          fi

          bencher run "${args[@]}"

  zig-unit:
    name: Zig unit tests (fast non-TSan)
    needs: changes
    if: ${{ needs.changes.outputs.run_zig == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # `zig build test` intentionally runs only the fast, non-TSan unit
      # lane. Concurrency/stress/fuzz tests are covered by the sharded
      # TSan, hammer TSan, and Loom/VOPR jobs below.
      - working-directory: zig
        run: zig build test

  zig-tsan:
    # Invokes the `test-tsan` step (LLVM + Debug + real ThreadSanitizer
    # instrumentation). The previous job ran `zig build test
    # -Dsanitize-thread`, which silently dropped TSan because stage2 +
    # Debug doesn't link the TSan runtime -- so it was effectively a
    # duplicate of zig-unit. Switching to test-tsan gets us actual
    # race detection.
    #
    # Hammer stress tests are split out into the dedicated `zig-hammer`
    # job below; `test-tsan` here covers the rest of the
    # concurrency-sensitive surface (per-test, not per-iteration).
    #
    # Sharded 5-way via build.zig's `tsan_step_idx % shard_count`
    # round-robin. Each shard compiles + runs ~1/5 of the tsan-tagged
    # tests under LLVM (slow compile, ~5-15x runtime overhead). Single
    # job hit the 60min ceiling; per-shard fits in 30min. fail-fast:
    # false so one flaky shard doesn't mask the rest.
    #
    # Serialize test binaries within each shard with `-j1`. The shards
    # themselves still run in parallel, but running multiple TSan-
    # instrumented scheduler tests concurrently inside one constrained
    # GitHub runner can starve/wedge progress and has hung shard 3/5 in
    # `spsc-scheduler-test` while the same binary passes repeatedly alone.
    name: Zig TSan (shard ${{ matrix.shard }}/5)
    needs: changes
    if: ${{ needs.changes.outputs.run_zig == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: zig
        run: zig build test-tsan -Dshard-index=${{ matrix.shard }} -Dshard-count=5 -j1 --test-timeout 240s

  zig-hammer:
    # Hammer stress tests (`*-hammer-test.zig`): high-iteration
    # concurrency probes whose value is amplified by every memory op
    # being TSan-instrumented. Excluded from `zig build test` (slow,
    # low marginal value un-instrumented) and from `zig build
    # test-tsan` (so the per-shard wallclock there stays bounded).
    # This job is the dedicated TSan-instrumented run.
    #
    # Sharded 5-way independently of test-tsan (separate counter in
    # build.zig: `hammer_step_idx % shard_count`). Same fail-fast:
    # false so one flaky shard doesn't mask the rest.
    name: Zig hammer TSan (shard ${{ matrix.shard }}/5)
    needs: changes
    if: ${{ needs.changes.outputs.run_zig == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: zig
        run: zig build test-hammer -Dshard-index=${{ matrix.shard }} -Dshard-count=5 -j1

  zig-loom-vopr:
    # Deterministic interleaving / simulation tests (`*-loom-test.zig`,
    # `*-vopr-test.zig`, plus the parking-lot-loom standalone exe).
    # These exhaustively explore schedules in-process — minutes per
    # test — and dominated `zig build test` wallclock when colocated
    # with unit tests. The exhaustive enumeration is its own race
    # detector, so they run WITHOUT TSan; TSan adds multiple-minutes
    # overhead with no marginal value. Excluded from `zig build test`,
    # `zig build test-tsan`, and `zig build test-hammer`.
    #
    # Sharded 5-way independently of test-tsan / test-hammer (separate
    # counter in build.zig: `loom_vopr_step_idx % shard_count`).
    # parking-lot-loom is wired to shard 0 only (single ~40s exe).
    name: Zig Loom/VOPR (shard ${{ matrix.shard }}/5)
    needs: changes
    if: ${{ needs.changes.outputs.run_zig == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: zig
        run: zig build test-loom-vopr -Dshard-index=${{ matrix.shard }} -Dshard-count=5

  zig-coverage:
    # Sharded across 5 parallel runners, same approach as zig-tsan.
    # kcov's DWARF instrumentation adds ~3x runtime overhead and the
    # single-job variant was hitting the 30min ceiling. Each shard
    # produces its own zig-out/coverage/merged/cobertura.xml from its
    # subset of tests; Codecov merges them server-side via the
    # shared `flags: zig` tag (union of covered lines per file).
    name: Zig coverage (kcov, shard ${{ matrix.shard }}/5)
    needs: changes
    if: ${{ needs.changes.outputs.run_zig == 'true' }}
    # Pin to jammy (22.04). noble (24.04 -- the current ubuntu-latest)
    # dropped kcov from its repos entirely; even with universe enabled
    # `apt-get install kcov` returns "Unable to locate package kcov".
    # jammy still ships kcov in universe.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kcov-bin
          key: kcov-v43-${{ runner.os }}
      - name: Install kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev libdw-dev binutils-dev libiberty-dev libelf-dev
          git clone --depth=1 --branch v43 https://github.com/SimonKagstrom/kcov.git
          cd kcov && mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/kcov-bin ..
          make -j$(nproc) && make install
      - name: Add kcov to PATH
        run: echo "${{ github.workspace }}/kcov-bin/bin" >> $GITHUB_PATH
      - working-directory: zig
        run: zig build test -Dcoverage -Dshard-index=${{ matrix.shard }} -Dshard-count=5 -j1
      - uses: actions/upload-artifact@v4
        with:
          name: zig-coverage-${{ matrix.shard }}
          path: zig/zig-out/coverage/merged/kcov-merged/cobertura.xml
          if-no-files-found: error
          retention-days: 7
      - uses: codecov/codecov-action@v5
        with:
          files: ./zig/zig-out/coverage/merged/kcov-merged/cobertura.xml
          disable_search: true
          flags: zig
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  zig-special-coverage:
    name: Zig ${{ matrix.suite }} coverage (kcov, shard ${{ matrix.shard }}/5)
    needs: changes
    if: ${{ needs.changes.outputs.run_zig == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [loom, vopr]
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/kcov-bin
          key: kcov-v43-${{ runner.os }}
      - name: Install kcov
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev zlib1g-dev libdw-dev binutils-dev libiberty-dev libelf-dev
          git clone --depth=1 --branch v43 https://github.com/SimonKagstrom/kcov.git
          cd kcov && mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/kcov-bin ..
          make -j$(nproc) && make install
      - name: Add kcov to PATH
        run: echo "${{ github.workspace }}/kcov-bin/bin" >> $GITHUB_PATH
      - working-directory: zig
        run: zig build coverage-${{ matrix.suite }} -Dcoverage-${{ matrix.suite }} -Dshard-index=${{ matrix.shard }} -Dshard-count=5 -j1
      - uses: actions/upload-artifact@v4
        with:
          name: zig-coverage-${{ matrix.suite }}-${{ matrix.shard }}
          path: zig/zig-out/coverage-${{ matrix.suite }}/merged/kcov-merged/cobertura.xml
          if-no-files-found: error
          retention-days: 7

  slopcop-report-sarif:
    name: SlopCop branch-gap SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - changes
      - ruby-unit
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.run_src == 'true' && needs.ruby-unit.result == 'success' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tree-sitter Ruby grammar
        run: npm install --no-save --package-lock=false tree-sitter-ruby@0.23.1
      - name: Download Ruby unit coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: ruby-coverage-unit
          path: tmp/ruby-coverage-unit
      - name: Generate SlopCop report SARIF
        run: |
          mkdir -p tmp
          coverage_path="$(find tmp/ruby-coverage-unit -name .resultset.json -type f | sort | head -n 1)"
          test -n "$coverage_path"
          timeout 15m bundle exec ruby gems/slopcop/exe/slopcop report \
            --repo=. \
            --coverage="$coverage_path" \
            --output=tmp/slopcop-report.md \
            --json=tmp/slopcop-report.json \
            --sarif=tmp/slopcop-report.sarif
      - name: Upload SlopCop report SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/slopcop-report.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: slopcop-report
          path: |
            tmp/slopcop-report.md
            tmp/slopcop-report.json
            tmp/slopcop-report.sarif
          if-no-files-found: error
          retention-days: 7

  slopcop-constraint-sarif:
    # Coverage evidence supplied: loom + vopr (zig kcov artifacts) and
    # nil-kill (ruby unit cobertura). Sanitizer-evidence constraints
    # (race/concurrency/tsan/asan/lsan/ubsan/miri/hammer) have no kcov
    # artifacts here - zig-tsan and zig-hammer run the real sanitizers but do
    # not emit line coverage - so their findings stay advisory warnings that
    # cannot be suppressed by evidence. The job intentionally runs without
    # --strict for that reason; wire per-suite kcov artifacts before making
    # any sanitizer constraint blocking.
    name: SlopCop constraint coverage SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - zig-special-coverage
      - sarif-rust-binaries
      - ruby-unit
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.changes.outputs.run_gems == 'true' || needs.changes.outputs.run_src == 'true' || needs.changes.outputs.run_zig == 'true') && (needs.zig-special-coverage.result == 'success' || needs.zig-special-coverage.result == 'skipped') && needs.sarif-rust-binaries.result == 'success' && (needs.ruby-unit.result == 'success' || needs.ruby-unit.result == 'skipped') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: sarif-rust-binaries
          path: tmp/sarif-binaries
      - name: Download specialized Zig coverage artifacts
        if: ${{ needs.zig-special-coverage.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: zig-coverage-*
          path: tmp/zig-special-coverage-artifacts
      - name: Download Ruby coverage artifact
        if: ${{ needs.ruby-unit.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ruby-coverage-unit
          path: tmp/ruby-coverage-unit
      - name: Generate SlopCop constraint SARIF
        run: |
          chmod +x tmp/sarif-binaries/fact-mine-rust
          git fetch origin "+${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          mkdir -p tmp
          args=()
          if [ -d tmp/zig-special-coverage-artifacts ]; then
            while IFS= read -r path; do
              args+=(--coverage="loom:${path}")
            done < <(find tmp/zig-special-coverage-artifacts -path '*zig-coverage-loom-*/*cobertura.xml' -type f | sort)
            while IFS= read -r path; do
              args+=(--coverage="vopr:${path}")
            done < <(find tmp/zig-special-coverage-artifacts -path '*zig-coverage-vopr-*/*cobertura.xml' -type f | sort)
          fi
          if [ -d tmp/ruby-coverage-unit ]; then
            while IFS= read -r path; do
              args+=(--coverage="nil-kill:${path}")
            done < <(find tmp/ruby-coverage-unit \( -name 'cobertura.xml' -o -name 'coverage.xml' \) -type f | sort)
          fi
          timeout 20m env FACT_MINE_RUST_BINARY=tmp/sarif-binaries/fact-mine-rust bundle exec ruby gems/slopcop/exe/slopcop constraints \
            --repo=. \
            --base="origin/${{ github.event.pull_request.base.ref }}" \
            --head=HEAD \
            "${args[@]}" \
            --sarif=tmp/slopcop-constraints.sarif \
            --markdown=tmp/slopcop-constraints.md
      - name: Upload SlopCop constraint SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/slopcop-constraints.sarif
          category: slopcop-constraints
      - uses: actions/upload-artifact@v4
        with:
          name: slopcop-constraints
          path: |
            tmp/slopcop-constraints.sarif
            tmp/slopcop-constraints.md
          if-no-files-found: error
          retention-days: 7

  architecture-sarif:
    # Architecture findings on changed files: dependency cycles
    # (espalier/tools/cycle_report.rb), cross-module private reach-through
    # (espalier/tools/reach_through_report.rb), and cross-module change
    # coupling (lineage/tools/change_coupling.rb). All three are advisory
    # (warning/note level); they annotate PRs and feed the Lineage ledger via
    # SARIF, they do not block merges.
    name: Architecture SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
      - sarif-rust-binaries
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.changes.outputs.run_gems == 'true' || needs.changes.outputs.run_src == 'true') && needs.sarif-rust-binaries.result == 'success' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: sarif-rust-binaries
          path: tmp/sarif-binaries
      - name: Generate architecture SARIFs
        run: |
          chmod +x tmp/sarif-binaries/fact-mine-rust
          git fetch origin "+${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          mkdir -p tmp
          export FACT_MINE_RUST_BINARY=$PWD/tmp/sarif-binaries/fact-mine-rust
          base="origin/${{ github.event.pull_request.base.ref }}"
          timeout 8m ruby gems/espalier/tools/cycle_report.rb . \
            --base="$base" --sarif=tmp/arch-cycles.sarif
          timeout 8m ruby gems/espalier/tools/reach_through_report.rb . \
            --base="$base" --sarif=tmp/arch-reach-through.sarif
          timeout 8m ruby gems/lineage/tools/change_coupling.rb . 8 \
            --base="$base" --sarif=tmp/arch-change-coupling.sarif
      - name: Upload cycles SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/arch-cycles.sarif
          category: architecture-cycles
      - name: Upload reach-through SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/arch-reach-through.sarif
          category: architecture-reach-through
      - name: Upload change-coupling SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/arch-change-coupling.sarif
          category: architecture-change-coupling
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-sarifs
          path: tmp/arch-*.sarif
          if-no-files-found: error
          retention-days: 7

  # Keep each SARIF producer in its own job. Besides isolating failures, this
  # makes a producer job directly copyable into a downstream repository.
  # Native analyzers are the sole shared prerequisite and are built once here.
  sarif-rust-binaries:
    name: Build shared SARIF analyzer binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.changes.outputs.run_gems == 'true' || needs.changes.outputs.run_src == 'true' || needs.changes.outputs.run_zig == 'true') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries once
        run: |
          cargo build --release --manifest-path gems/fact-mine/Cargo.toml
          cargo build --release --manifest-path gems/decomplex/Cargo.toml
          cargo build --release --manifest-path gems/sql-cov/Cargo.toml
          mkdir -p tmp/sarif-binaries
          install -m 755 gems/fact-mine/target/release/fact-mine-rust tmp/sarif-binaries/fact-mine-rust
          install -m 755 gems/decomplex/target/release/decomplex-rust tmp/sarif-binaries/decomplex-rust
          install -m 755 gems/sql-cov/target/release/sql-cov tmp/sarif-binaries/sql-cov
      - uses: actions/upload-artifact@v4
        with:
          name: sarif-rust-binaries
          path: tmp/sarif-binaries
          if-no-files-found: error
          retention-days: 1

  decomplex-sarif:
    name: Decomplex SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, sarif-rust-binaries]
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.sarif-rust-binaries.result == 'success' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: sarif-rust-binaries
          path: tmp/sarif-binaries
      - name: Generate Decomplex report
        run: |
          chmod +x tmp/sarif-binaries/decomplex-rust
          git fetch origin "+${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          timeout 15m bundle exec ruby tools/generate_generalized_gem_sarif.rb \
            --repo=. \
            --base="origin/${{ github.event.pull_request.base.ref }}" \
            --head=HEAD \
            --out-dir=tmp/decomplex-sarif \
            --decomplex-binary=tmp/sarif-binaries/decomplex-rust \
            --only=decomplex
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/decomplex-sarif/decomplex.sarif
          category: decomplex
      - uses: actions/upload-artifact@v4
        with:
          name: decomplex-sarif
          path: tmp/decomplex-sarif
          if-no-files-found: error
          retention-days: 7

  boobytrap-sarif:
    name: Boobytrap SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - ruby-gems-coverage
      - ruby-unit
      - ruby-integration
      - transpile-tests
      - examples-benchmarks-coverage-shard
      - tools-fuzz-shard
      - bc-lower-coverage-shard
      - zig-coverage
      - zig-mutants-coverage
      - lineage-rust-coverage
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.changes.outputs.run_gems == 'true' || needs.changes.outputs.run_src == 'true' || needs.changes.outputs.run_zig == 'true') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: gems/boobytrap/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Download Ruby coverage artifacts
        if: ${{ needs['ruby-gems-coverage'].result == 'success' || needs['ruby-unit'].result == 'success' || needs['ruby-integration'].result == 'success' || needs['transpile-tests'].result == 'success' || needs['examples-benchmarks-coverage-shard'].result == 'success' || needs['tools-fuzz-shard'].result == 'success' || needs['bc-lower-coverage-shard'].result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ruby-coverage-*
          path: tmp/sarif-coverage
      - name: Download Zig coverage artifacts
        if: ${{ needs['zig-coverage'].result == 'success' || needs['zig-mutants-coverage'].result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: zig-coverage-*
          path: tmp/sarif-coverage
      - name: Download Lineage Rust coverage artifact
        if: ${{ needs['lineage-rust-coverage'].result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: lineage-rust-coverage
          path: tmp/sarif-coverage/lineage-rust-coverage
      - name: Generate Boobytrap report
        run: |
          git fetch origin "+${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          coverage_args=()
          while IFS= read -r path; do
            coverage_args+=(--coverage="${path}")
          done < <(
            find tmp/sarif-coverage -type f \
              \( -name .resultset.json -o -name cobertura.xml -o -name codecov.json \) \
              ! -path '*zig-coverage-loom-*' \
              ! -path '*zig-coverage-vopr-*' \
              | sort
          )
          timeout 20m bundle exec ruby tools/generate_generalized_gem_sarif.rb \
            --repo=. \
            --base="origin/${{ github.event.pull_request.base.ref }}" \
            --head=HEAD \
            --out-dir=tmp/boobytrap-sarif \
            --top=80 \
            --only=boobytrap \
            "${coverage_args[@]}"
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/boobytrap-sarif/boobytrap.sarif
          category: boobytrap
      - uses: actions/upload-artifact@v4
        with:
          name: boobytrap-sarif
          path: tmp/boobytrap-sarif
          if-no-files-found: error
          retention-days: 7

  slopcop-sarif:
    name: SlopCop SARIF
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - ruby-gems-coverage
      - ruby-unit
      - ruby-integration
      - transpile-tests
      - examples-benchmarks-coverage-shard
      - tools-fuzz-shard
      - bc-lower-coverage-shard
      - zig-coverage
      - zig-mutants-coverage
      - lineage-rust-coverage
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.changes.outputs.run_gems == 'true' || needs.changes.outputs.run_src == 'true' || needs.changes.outputs.run_zig == 'true') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: gems/boobytrap/go.sum
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Download Ruby coverage artifacts
        if: ${{ needs['ruby-gems-coverage'].result == 'success' || needs['ruby-unit'].result == 'success' || needs['ruby-integration'].result == 'success' || needs['transpile-tests'].result == 'success' || needs['examples-benchmarks-coverage-shard'].result == 'success' || needs['tools-fuzz-shard'].result == 'success' || needs['bc-lower-coverage-shard'].result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: ruby-coverage-*
          path: tmp/sarif-coverage
      - name: Download Zig coverage artifacts
        if: ${{ needs['zig-coverage'].result == 'success' || needs['zig-mutants-coverage'].result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: zig-coverage-*
          path: tmp/sarif-coverage
      - name: Download Lineage Rust coverage artifact
        if: ${{ needs['lineage-rust-coverage'].result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: lineage-rust-coverage
          path: tmp/sarif-coverage/lineage-rust-coverage
      - name: Generate SlopCop report
        run: |
          git fetch origin "+${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          coverage_args=()
          while IFS= read -r path; do
            coverage_args+=(--coverage="${path}")
          done < <(
            find tmp/sarif-coverage -type f \
              \( -name .resultset.json -o -name cobertura.xml -o -name codecov.json \) \
              ! -path '*zig-coverage-loom-*' \
              ! -path '*zig-coverage-vopr-*' \
              | sort
          )
          timeout 20m bundle exec ruby tools/generate_generalized_gem_sarif.rb \
            --repo=. \
            --base="origin/${{ github.event.pull_request.base.ref }}" \
            --head=HEAD \
            --out-dir=tmp/slopcop-sarif \
            --top=80 \
            --only=slopcop \
            "${coverage_args[@]}"
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/slopcop-sarif/slopcop.sarif
          category: slopcop
      - uses: actions/upload-artifact@v4
        with:
          name: slopcop-sarif
          path: tmp/slopcop-sarif
          if-no-files-found: error
          retention-days: 7

