        shard: [0, 1, 2, 3, 4]
    env:
      COVERAGE: "1"
      COVERAGE_ISOLATED: "1"
      ZIG_COVERAGE: "1"
      ZIG_COVERAGE_SUITE: "fuzz"
    steps:
