  diff-coverage-comment:
    name: Diff coverage bucket PR comment
    runs-on: ubuntu-latest
    needs:
      - changes
      - ruby-unit
      - ruby-integration
      - transpile-tests
      - examples-benchmarks-coverage-shard
      - tools-fuzz-shard
      - bc-lower-coverage-shard
      - zig-coverage
    if: >-
      ${{
        always() &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.changes.outputs.run_src == 'true' &&
        needs.ruby-unit.result == 'success' &&
        needs.ruby-integration.result == 'success' &&
        needs.transpile-tests.result == 'success' &&
        needs.examples-benchmarks-coverage-shard.result == 'success' &&
        needs.tools-fuzz-shard.result == 'success' &&
        needs.bc-lower-coverage-shard.result == 'success' &&
        (needs.changes.outputs.run_zig != 'true' || needs.zig-coverage.result == 'success')
      }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Tree-sitter Ruby grammar
        run: npm install --no-save --package-lock=false tree-sitter-ruby@0.23.1
      - name: Download Ruby coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ruby-coverage-*
          path: tmp/ruby-coverage-artifacts
      - name: Download Zig coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: zig-coverage-*
          path: tmp/zig-coverage-artifacts
      - name: Generate diff coverage bucket markdown
        run: |
          git fetch origin "+${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"
          mkdir -p tmp
          ruby_paths="$(find tmp/ruby-coverage-artifacts -name .resultset.json -type f | sort | paste -sd: -)"
          zig_paths="$(find tmp/zig-coverage-artifacts -name cobertura.xml -type f | sort | paste -sd: -)"
          RUBY_COVERAGE_PATHS="$ruby_paths" \
          ZIG_COVERAGE_PATHS="$zig_paths" \
            bundle exec ruby tools/diff_bucket_summary.rb "origin/${{ github.event.pull_request.base.ref }}" --format markdown --src-visibility --type-guardrails-sarif tmp/src-type-guardrails.sarif \
            > tmp/diff-bucket-summary.md
      - name: Upload Src Type Guardrails SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/src-type-guardrails.sarif
          category: src-type-guardrails
      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- clear-diff-coverage-buckets -->';
            const report = fs.readFileSync('tmp/diff-bucket-summary.md', 'utf8').trim();
            const body = `${marker}\n${report}\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
