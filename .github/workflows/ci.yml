  tools-fuzz-shard:
    name: tools/fuzz coverage shard ${{ matrix.shard }}/5
    needs: changes
    if: ${{ needs.changes.outputs.run_src == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
