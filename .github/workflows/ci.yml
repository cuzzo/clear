name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same branch when a
# new commit lands. Keeps queue depth low for rapid-fire pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  RUBY_VERSION: "3.2"
  # Default off — most jobs skip the SimpleCov instrumentation overhead.
  # ruby-unit overrides this to "1" so its run drops a Cobertura XML
  # for codecov-action to pick up.
  COVERAGE: "0"

jobs:
  ruby-unit:
    name: Ruby unit specs (parallel, no integration)
    runs-on: ubuntu-latest
    env:
      COVERAGE: "1"  # SimpleCov writes coverage/coverage.xml for Codecov upload below
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec prspec spec/
      # Collate parallel_rspec workers' resultsets into a single Cobertura
      # XML before upload (each worker writes its own `RSpec-w<id>-<pid>`
      # entry into coverage/.resultset.json; collate_coverage merges them
      # back into one entry that the Cobertura formatter understands).
      - run: bundle exec ruby spec/collate_coverage.rb
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.xml
          flags: ruby
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  ruby-integration:
    name: Ruby integration specs (builds binaries via clear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: bundle exec prspec spec/ --tag integration

  transpile-tests:
    name: transpile-tests/ (.cht via clear test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: ./clear test transpile-tests/

  module-integration:
    name: transpile-tests/module-integration (zig build test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: transpile-tests/module-integration
        run: zig build test

  ffi-integration:
    name: transpile-tests/ffi-integration (zig build test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: transpile-tests/ffi-integration
        run: zig build test

  zig-unit:
    name: Zig unit tests (zig build test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: zig
        run: zig build test

  zig-tsan:
    name: Zig unit tests (TSan)
    runs-on: ubuntu-latest
    # ThreadSanitizer adds 5-15x runtime overhead; give it more headroom
    # than the regular unit-test job.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: zig
        run: zig build test -Dsanitize-thread

  zig-coverage:
    name: Zig unit tests (coverage via kcov)
    runs-on: ubuntu-latest
    # kcov DWARF instrumentation adds ~3x runtime overhead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # kcov is the standard sampling-coverage tool for Zig binaries
      # (DWARF-based, no recompile needed). Output: Cobertura XML in
      # zig-out/coverage/merged/cobertura.xml after the merge step.
      #
      # Build from source — kcov isn't reliably present in the
      # ubuntu-latest apt repos (the runner's apt-get install -y kcov
      # hit "Unable to locate package kcov" on a recent image). Pinning
      # v43 (May 2024) keeps the version stable; ~30s build is amortized
      # against the actual test run.
      - name: Install kcov
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            cmake binutils-dev libcurl4-openssl-dev zlib1g-dev \
            libdw-dev libiberty-dev libssl-dev pkg-config
          wget -q https://github.com/SimonKagstrom/kcov/archive/refs/tags/v43.tar.gz -O kcov-src.tar.gz
          tar xf kcov-src.tar.gz
          cd kcov-43
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j"$(nproc)"
          sudo make install
          kcov --version
      - working-directory: zig
        run: zig build test -Dcoverage
      - uses: codecov/codecov-action@v5
        with:
          files: ./zig/zig-out/coverage/merged/cobertura.xml
          flags: zig
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
