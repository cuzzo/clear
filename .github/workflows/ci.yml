name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel in-progress runs of the same workflow on the same branch when a
# new commit lands. Keeps queue depth low for rapid-fire pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  RUBY_VERSION: "3.2"
  # Default off — most jobs skip the SimpleCov instrumentation overhead.
  # ruby-unit overrides this to "1" so its run drops a Cobertura XML
  # for codecov-action to pick up.
  COVERAGE: "0"

jobs:
  ruby-unit:
    name: Ruby unit specs (parallel, no integration)
    runs-on: ubuntu-latest
    env:
      COVERAGE: "1"  # SimpleCov writes coverage/coverage.xml for Codecov upload below
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - run: bundle exec prspec spec/
      # Collate parallel_rspec workers' resultsets into a single Cobertura
      # XML before upload (each worker writes its own `RSpec-w<id>-<pid>`
      # entry into coverage/.resultset.json; collate_coverage merges them
      # back into one entry that the Cobertura formatter understands).
      - run: bundle exec ruby spec/collate_coverage.rb
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.xml
          flags: ruby
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  ruby-integration:
    name: Ruby integration specs (builds binaries via clear)
    runs-on: ubuntu-latest
    env:
      COVERAGE: "1"  # Picked up by spec_helper + clear-CLI's coverage_bootstrap;
                     # makes integration-only files (clear_bin_spec, clear_fix_spec,
                     # vm_bg_capture, etc.) contribute to the Ruby flag on Codecov.
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Cache clear's per-source build dirs + transpiled .zig outputs.
      # Each `./clear build` keys the cache off the source path SHA, so
      # every fresh tmp dir in clear_bin_spec hits cold. Persisting these
      # caches across CI runs (keyed on src/ + zig/runtime/ + zig/lib/
      # + Gemfile.lock + zig version) means subsequent pushes start
      # warm. Restore-keys gives a partial hit when only some inputs
      # change.
      - uses: actions/cache@v4
        with:
          path: |
            zig/.clear-cache
            zig/.clear-transpile-cache
          key: clear-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('src/**', 'zig/runtime/**', 'zig/lib/**', 'Gemfile.lock') }}
          restore-keys: |
            clear-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-
      - run: bundle exec prspec spec/ --tag integration
      # Collate workers + clear-CLI subprocess resultsets into a single
      # Cobertura XML, same as the unit job. Both unit and integration
      # uploads use `flags: ruby` so Codecov merges them server-side
      # into one Ruby coverage view.
      - run: bundle exec ruby spec/collate_coverage.rb
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.xml
          flags: ruby
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  transpile-tests:
    name: transpile-tests/ (.cht via clear test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # Same cache as ruby-integration -- both jobs hammer ./clear build
      # and benefit from a warm clear-cache + transpile-cache across runs.
      - uses: actions/cache@v4
        with:
          path: |
            zig/.clear-cache
            zig/.clear-transpile-cache
          key: clear-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('src/**', 'zig/runtime/**', 'zig/lib/**', 'Gemfile.lock') }}
          restore-keys: |
            clear-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-
      - run: ./clear test transpile-tests/

  module-integration:
    name: transpile-tests/module-integration (zig build test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # build.zig invokes `ruby src/backends/transpiler.rb` to lower
      # .cht to Zig; transpiler.rb does `require 'bundler/setup'` so
      # we need both Ruby and bundle install before zig build runs.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: transpile-tests/module-integration
        run: zig build test

  ffi-integration:
    name: transpile-tests/ffi-integration (zig build test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # build.zig invokes `ruby src/backends/transpiler.rb` to lower
      # .cht to Zig; transpiler.rb does `require 'bundler/setup'` so
      # we need both Ruby and bundle install before zig build runs.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: transpile-tests/ffi-integration
        run: zig build test

  zig-unit:
    name: Zig unit tests (fast non-TSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      # `zig build test` intentionally runs only the fast, non-TSan unit
      # lane. Concurrency/stress/fuzz tests are covered by the sharded
      # TSan, hammer TSan, and Loom/VOPR jobs below.
      - working-directory: zig
        run: zig build test

  zig-tsan:
    # Invokes the `test-tsan` step (LLVM + Debug + real ThreadSanitizer
    # instrumentation). The previous job ran `zig build test
    # -Dsanitize-thread`, which silently dropped TSan because stage2 +
    # Debug doesn't link the TSan runtime -- so it was effectively a
    # duplicate of zig-unit. Switching to test-tsan gets us actual
    # race detection.
    #
    # Hammer stress tests are split out into the dedicated `zig-hammer`
    # job below; `test-tsan` here covers the rest of the
    # concurrency-sensitive surface (per-test, not per-iteration).
    #
    # Sharded 5-way via build.zig's `tsan_step_idx % shard_count`
    # round-robin. Each shard compiles + runs ~1/5 of the tsan-tagged
    # tests under LLVM (slow compile, ~5-15x runtime overhead). Single
    # job hit the 60min ceiling; per-shard fits in 30min. fail-fast:
    # false so one flaky shard doesn't mask the rest.
    #
    # Serialize test binaries within each shard with `-j1`. The shards
    # themselves still run in parallel, but running multiple TSan-
    # instrumented scheduler tests concurrently inside one constrained
    # GitHub runner can starve/wedge progress and has hung shard 3/5 in
    # `spsc-scheduler-test` while the same binary passes repeatedly alone.
    name: Zig TSan (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: zig
        run: zig build test-tsan -Dshard-index=${{ matrix.shard }} -Dshard-count=5 -j1

  zig-hammer:
    # Hammer stress tests (`*-hammer-test.zig`): high-iteration
    # concurrency probes whose value is amplified by every memory op
    # being TSan-instrumented. Excluded from `zig build test` (slow,
    # low marginal value un-instrumented) and from `zig build
    # test-tsan` (so the per-shard wallclock there stays bounded).
    # This job is the dedicated TSan-instrumented run.
    #
    # Sharded 5-way independently of test-tsan (separate counter in
    # build.zig: `hammer_step_idx % shard_count`). Same fail-fast:
    # false so one flaky shard doesn't mask the rest.
    name: Zig hammer TSan (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: zig
        run: zig build test-hammer -Dshard-index=${{ matrix.shard }} -Dshard-count=5

  zig-loom-vopr:
    # Deterministic interleaving / simulation tests (`*-loom-test.zig`,
    # `*-vopr-test.zig`, plus the parking-lot-loom standalone exe).
    # These exhaustively explore schedules in-process — minutes per
    # test — and dominated `zig build test` wallclock when colocated
    # with unit tests. The exhaustive enumeration is its own race
    # detector, so they run WITHOUT TSan; TSan adds multiple-minutes
    # overhead with no marginal value. Excluded from `zig build test`,
    # `zig build test-tsan`, and `zig build test-hammer`.
    #
    # Sharded 5-way independently of test-tsan / test-hammer (separate
    # counter in build.zig: `loom_vopr_step_idx % shard_count`).
    # parking-lot-loom is wired to shard 0 only (single ~40s exe).
    name: Zig Loom/VOPR (shard ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - working-directory: zig
        run: zig build test-loom-vopr -Dshard-index=${{ matrix.shard }} -Dshard-count=5

  zig-coverage:
    # Sharded across 5 parallel runners, same approach as zig-tsan.
    # kcov's DWARF instrumentation adds ~3x runtime overhead and the
    # single-job variant was hitting the 30min ceiling. Each shard
    # produces its own zig-out/coverage/merged/cobertura.xml from its
    # subset of tests; Codecov merges them server-side via the
    # shared `flags: zig` tag (union of covered lines per file).
    name: Zig coverage (kcov, shard ${{ matrix.shard }}/5)
    # Pin to jammy (22.04). noble (24.04 -- the current ubuntu-latest)
    # dropped kcov from its repos entirely; even with universe enabled
    # `apt-get install kcov` returns "Unable to locate package kcov".
    # jammy still ships kcov in universe.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y kcov
          kcov --version
      - working-directory: zig
        run: zig build test -Dcoverage -Dshard-index=${{ matrix.shard }} -Dshard-count=5
      - uses: codecov/codecov-action@v5
        with:
          files: ./zig/zig-out/coverage/merged/cobertura.xml
          flags: zig
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
