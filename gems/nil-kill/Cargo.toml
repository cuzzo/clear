[package]
name = "nil-kill-infer-rust"
version = "0.1.0"
edition = "2021"
description = "Native inference engine for NilKill"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "nil-kill-infer-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
z3 = "0.12.1"

[dev-dependencies]
tempfile = "=3.10.1"
fact-mine-rust = { path = "../fact-mine" }
