[package]
name = "lineage"
version = "0.1.0"
edition = "2021"
description = "Logical-unit history engine for Boobytrap and sibling gems"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "lineage"
path = "src/lib.rs"

[[bin]]
name = "lineage"
path = "src/main.rs"

[dependencies]
hazard-contract = { path = "../hazard-contract" }
fact-mine-rust = { path = "../fact-mine" }
anyhow = "1.0"
askama = "0.12"
axum = "0.7"
clap = { version = "=4.4.18", features = ["derive"] }
git2 = "0.18"
hex = "0.4"
idna_adapter = "=1.0.0"
openssl-sys = "=0.9.102"
rusqlite = { version = "0.30", features = ["bundled"] }
roxmltree = "0.19"
rust-embed = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rayon = "1.8"
tokio = { version = "1", features = ["io-std", "macros", "net", "rt", "rt-multi-thread"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["set-header", "trace"] }
tower-lsp = "0.20"
tree-sitter = "=0.25.8"
tree-sitter-c = "=0.24.1"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-language = "=0.1.3"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-zig = "=1.1.2"
tree-sitter-java = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-lua = "=0.4.1"
tree-sitter-php = "=0.24.2"
tree-sitter-swift = "=0.7.1"
streaming-iterator = "0.1.9"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }

[dev-dependencies]
tempfile = "=3.10.1"
