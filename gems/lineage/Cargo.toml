[package]
name = "lineage"
version = "0.1.0"
edition = "2021"
description = "Logical-unit history engine for Boobytrap and sibling gems"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "lineage"
path = "src/lib.rs"

[[bin]]
name = "lineage"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
git2 = "0.18"
hex = "0.4"
idna_adapter = "=1.0.0"
openssl-sys = "=0.9.102"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "=3.10.1"
