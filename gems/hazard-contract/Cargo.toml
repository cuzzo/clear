[package]
name = "hazard-contract"
version = "0.1.0"
edition = "2021"
description = "Hazard policy and query resources shared by source scanners"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Conformance tests validate bundled JSON only; remote/file reference support
# is unnecessary and would pull an HTTP stack into this small contract crate.
jsonschema = { version = "0.18", default-features = false }
