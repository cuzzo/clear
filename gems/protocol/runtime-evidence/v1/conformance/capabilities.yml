version: 1
wire_matrix:
  anchor_kinds:
    - FUNCTION_ENTRY
    - FUNCTION_RETURN
    - CALL_SELECTOR
    - STATE_READ
    - STATE_WRITE
    - CALLBACK_ENTRY
    - COLLECTION_OPERATION
    - BRANCH_PREDICATE
  planner_anchor_kinds:
    - FUNCTION_ENTRY
    - FUNCTION_RETURN
    - CALL_SELECTOR
    - STATE_WRITE
    - COLLECTION_OPERATION
    - BRANCH_PREDICATE
  reserved_anchor_kinds:
    STATE_READ: FactMine currently propagates state from observed writes and does not request read capture.
    CALLBACK_ENTRY: FactMine currently derives callback parameter flow from collection/call evidence and does not request callback-entry capture.
  evidence_kinds:
    - PARAMETER_VALUE
    - RETURN_VALUE
    - RECEIVER_VALUE
    - CALL_TARGET
    - RESULT_VALUE
    - BOOLEAN_RESULT
    - STATE_VALUE
    - COLLECTION_VALUE
  capture_statuses:
    - COMPLETE_FOR_RUNS
    - NOT_EXECUTED
    - PARTIAL
    - NOT_INSTRUMENTED
    - UNSUPPORTED
    - STALE
    - FAILED_CAPTURE
  source_roles:
    - PRODUCTION
    - NON_PRODUCTION
    - STANDARD_LIBRARY
    - DEPENDENCY
    - RUNTIME
    - UNKNOWN_SOURCE
  value_shapes: [sequence, mapping, record, tuple]
  negative_controls:
    - unknown-field
    - missing-anchor
    - duplicate-anchor
    - stale-plan-digest
    - stale-anchor-digest
    - incomplete-kind-without-field
    - complete-with-dropped-execution
    - complete-with-truncated-value
    - unknown-run-provenance
    - noncanonical-path
    - noncanonical-symbol
    - missing-call-execution-range
    - execution-range-excludes-selector
    - incompatible-anchor-evidence
  request_contracts:
    FUNCTION_ENTRY: [PARAMETER_VALUE]
    FUNCTION_RETURN: [RETURN_VALUE]
    CALL_SELECTOR: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE]
    STATE_READ: [STATE_VALUE]
    STATE_WRITE: [STATE_VALUE]
    CALLBACK_ENTRY: [PARAMETER_VALUE]
    COLLECTION_OPERATION: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE, COLLECTION_VALUE]
    BRANCH_PREDICATE: [RECEIVER_VALUE, CALL_TARGET, RESULT_VALUE, BOOLEAN_RESULT]

fixture:
  language: ruby
  source: ruby/capabilities.rb
  driver: ruby/driver.rb
  support:
    - ruby/dependency/generated_record.rb
    - ruby/test/test_dispatcher.rb

# Calls in this table are intentionally absent from the runtime trace plan:
# FactMine has already bound them to an analyzed declaration. The oracle must
# prove both the exact static target and the absence of a redundant request.
static_closures:
  - id: direct_local_module_function
    capabilities: [ruby-call, module-method, module-function, project-call, statically-indexed-target]
    anchor: { method: local_module_function, selector: classify, occurrence: 1 }
    expect:
      target_owner: RuntimeEvidenceConformance::LocalModuleFunctions
      target_name: classify

  - id: nested_local_module_function
    capabilities: [ruby-call, module-method, module-function, project-call, statically-indexed-target, nested-argument, nested-call]
    anchor: { method: nested_local_module_function, selector: classify, occurrence: 1 }
    expect:
      target_owner: RuntimeEvidenceConformance::LocalModuleFunctions
      target_name: classify

# Each entry names a semantic capability, not a bug or application.
# `anchor` is resolved against FactMine's plan; collectors only receive the
# resulting opaque request.
cases:
  - id: exact_ruby_call
    capabilities: [exact-anchor, ruby-call, receiver, target, result]
    anchor: { method: exact_call, selector: normalize, occurrence: 1 }
    expect:
      required: [RECEIVER_VALUE, CALL_TARGET]
      receiver_type: RuntimeEvidenceConformance::Value
      target_owner: RuntimeEvidenceConformance::Value
      target_name: normalize
      source_role: PRODUCTION

  - id: nil_return_call
