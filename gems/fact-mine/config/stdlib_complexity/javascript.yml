# ECMAScript built-ins. Kept separately from TypeScript so each language has
# an independently reviewable native API contract.
Array:
  at: constant
  length: constant
  pop: constant
  push: constant
  shift: linear_scan
  unshift: linear_scan
  includes: linear_scan
  find: linear_scan
  findIndex: linear_scan
  indexOf: linear_scan
  lastIndexOf: linear_scan
  concat: linear_materialize
  filter: linear_materialize
  flatMap: linear_materialize
  map: linear_materialize
  slice: linear_materialize
  splice: linear_materialize
  reverse: linear_scan
  forEach: linear_scan
  every: linear_scan
  some: linear_scan
  reduce: linear_scan
  sort: sort
Hash:
  get: constant
  has: constant
  set: constant
  delete: constant
  size: constant
  entries: linear_materialize
  keys: linear_materialize
  values: linear_materialize
Set:
  add: constant
  has: constant
  delete: constant
  size: constant
  entries: linear_materialize
  keys: linear_materialize
  values: linear_materialize
string:
  includes: linear_scan
  indexOf: linear_scan
  lastIndexOf: linear_scan
  match: linear_scan
  search: linear_scan
  split: linear_materialize
  slice: linear_materialize
  substring: linear_materialize
  trim: linear_materialize
  length: constant
String:
  includes: linear_scan
  indexOf: linear_scan
  lastIndexOf: linear_scan
  match: linear_scan
  search: linear_scan
  split: linear_materialize
  slice: linear_materialize
  substring: linear_materialize
  trim: linear_materialize
  length: constant
Intrinsic:
  "Array.isArray": constant
