  "Process.cwd": constant
  "Process.emitWarning": constant
  "Module.resolve": linear_scan
  "Stream.pipeline": linear_scan
SemanticSymbolParametricCost:
  'lib/`lib.es5.d.ts`/Array#every().': callback_linear
  'lib/`lib.es5.d.ts`/Array#filter().': callback_linear
  'lib/`lib.es5.d.ts`/Array#forEach().': callback_linear
  'lib/`lib.es5.d.ts`/Array#map().': callback_linear
  'lib/`lib.es5.d.ts`/Array#reduce().': callback_linear
  'lib/`lib.es5.d.ts`/Array#some().': callback_linear
  'lib/`lib.es2015.core.d.ts`/Array#find().': callback_linear
  'lib/`lib.es2015.core.d.ts`/Array#findIndex().': callback_linear
  'lib/`lib.es5.d.ts`/Function#apply().': callback_once
  'lib/`lib.es5.d.ts`/Function#call().': callback_once
  '`events.d.ts`/`"node:events"`/global/NodeJS/EventEmitter#emit().': callback_linear
  '`diagnostics_channel.d.ts`/`"node:diagnostics_channel"`/TracingChannel#traceSync().': callback_once
Namespace:
  Array: declaration
  Date: declaration
  JSON: declaration
  Math: declaration
  Object: declaration
  Promise: declaration
  Reflect: declaration
  RegExp: declaration
  String: declaration
DynamicGlobalBinding:
  enabled: declaration
