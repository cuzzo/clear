SemanticSymbolAssumptions:
  "java/lang/Object#equals().": "runtime receiver belongs to the reviewed JDK/project value universe and its override is at most linear in reachable value size"
  "java/lang/Object#toString().": "runtime receiver belongs to the reviewed JDK/project value universe and rendering is at most linear in reachable value size"
  "java/lang/String#format().": "format arguments use reviewed renderers whose work is at most linear in reachable argument and output size"
  "java/lang/String#valueOf().": "the selected runtime renderer belongs to the reviewed JDK/project value universe"
  "java/util/Objects#deepEquals().": "the compared value graph is acyclic and nested equals implementations belong to the reviewed universe"
  "java/util/Objects#equals().": "the selected equals implementation belongs to the reviewed JDK/project value universe"
  "java/util/stream/Stream#collect(+1).": "the collector belongs to the reviewed sequential collector universe with bounded per-element callbacks"
  "java/util/stream/Stream#count().": "the stream is sequential and each upstream callback has at most linear cost in its argument"
  "java/util/stream/Stream#findFirst().": "the stream is sequential and each upstream callback has at most linear cost in its argument"
  "java/util/stream/Stream#max().": "the stream is sequential and the comparator has at most linear cost in its arguments"
  "javax/lang/model/element/Element#accept().": "the visitor belongs to the reviewed javac/project visitor universe"
  "javax/lang/model/type/TypeMirror#accept().": "the visitor belongs to the reviewed javac/project visitor universe"
