  starts_with: linear_scan
  substr: linear_materialize
# Direct `std::algorithm` calls deliberately remain absent. The C++ adapter
# currently projects them as a callable expression rather than a resolved
# receiver/message pair; mapping that parser artifact here would make the
# language registry depend on syntax details. Add these after the adapter
# resolves direct calls to their native identities.
Namespace:
  std: declaration
Intrinsic:
  assert: declaration
  malloc: declaration
  calloc: declaration
  realloc: declaration
  free: declaration
  puts: declaration
  strlen: linear_scan
NonCallPrefix:
  "static_cast<": declaration
  "reinterpret_cast<": declaration
  "const_cast<": declaration
  "dynamic_cast<": declaration
