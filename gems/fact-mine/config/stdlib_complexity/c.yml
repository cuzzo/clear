# ISO C library calls. These are free functions because C has no native
# collection methods. Do not add project-local helpers here.
Intrinsic:
  strlen: linear_scan
  strnlen: linear_scan
  strchr: linear_scan
  strrchr: linear_scan
  memchr: linear_scan
  memcmp: linear_scan
  memcpy: linear_scan
  memmove: linear_scan
  memset: linear_scan
  strcpy: linear_scan
  strncpy: linear_scan
  strcat: linear_scan
  strncat: linear_scan
  strcmp: linear_scan
  strncmp: linear_scan
  qsort: sort
  bsearch: logarithmic
  # Allocation is bounded by the requested byte count. Treat deallocation as
  # a linear allocator upper bound rather than assuming a particular libc's
  # constant-time free-list implementation.
  malloc: linear_materialize
  calloc: linear_materialize
  realloc: linear_materialize
  free: linear_scan
  # Formatting/parsing and byte-stream transfer are bounded by the consumed or
  # produced sequence. External latency is outside the in-process Big-O model.
  printf: linear_scan
  fprintf: linear_scan
  sprintf: linear_scan
  snprintf: linear_scan
  puts: linear_scan
  putchar: constant
  fopen: declaration
  fclose: declaration
  fread: linear_scan
  fwrite: linear_scan
  abort: constant
  exit: constant
  assert: declaration
  va_start: declaration
  va_arg: declaration
  va_copy: declaration
  va_end: declaration
  tolower: constant
  toupper: constant
  fabs: declaration
  strtol: linear_scan
  strtoul: linear_scan
  strtod: linear_scan
  strtof: linear_scan
  strtold: linear_scan
  ungetc: declaration
  ftell: declaration
  fseek: declaration
  close: declaration
  fcntl: declaration
  vsprintf: declaration
  vsnprintf: declaration
  strerror: declaration
  perror: declaration
  sscanf: linear_scan
  fscanf: linear_scan
  scanf: linear_scan
  localeconv: constant
  isspace: constant
  isdigit: constant
  isalpha: constant
  isalnum: constant
  kevent: declaration
  kqueue: declaration
  # C99 <math.h>: constant-time on a fixed-width float/double (the value is one
  # scalar; there is no input-size dimension to grow in). Classification (not
  # `signbit`), rounding, scaling, decomposition, and elementary functions.
  isnan: constant
  isinf: constant
  isfinite: constant
  isnormal: constant
  signbit: constant
  fpclassify: constant
  fabs: constant
  floor: constant
  ceil: constant
  round: constant
  roundf: constant
  roundl: constant
  lround: constant
  llround: constant
  trunc: constant
  truncf: constant
  truncl: constant
  rint: constant
  rintf: constant
  rintl: constant
  lrint: constant
  nearbyint: constant
  scalbn: constant
  scalbnf: constant
  scalbnl: constant
  scalbln: constant
  ldexp: constant
  frexp: constant
  modf: constant
  ilogb: constant
  logb: constant
  copysign: constant
  nextafter: constant
  nexttoward: constant
  fmod: constant
  remainder: constant
  fdim: constant
  fmax: constant
  fmin: constant
  fma: constant
  sqrt: constant
  sqrtf: constant
  cbrt: constant
  hypot: constant
  pow: constant
  exp: constant
  exp2: constant
  expm1: constant
  log: constant
  log2: constant
  log10: constant
  log1p: constant
  sin: constant
  cos: constant
  tan: constant
  asin: constant
  acos: constant
  atan: constant
  atan2: constant
  sinh: constant
  cosh: constant
  tanh: constant
