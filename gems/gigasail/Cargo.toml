[workspace]
members = ["giga-core", "giga-ui"]
resolver = "2"

[package]
name = "gigasail"
version = "0.0.1"
edition = "2021"
description = "Risk-weighted diff review and logical-unit history engine"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "gigasail"
path = "src/lib.rs"

[[bin]]
name = "giga"
path = "src/main.rs"

[dependencies]
giga-core = { path = "giga-core", version = "0.0.1" }
anyhow = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
crossterm = "0.28"
git2 = "0.18"
ratatui = "0.29"
serde_json = "1.0"
ts-rs = "10.1"
# The MCP server (`giga mcp`) is a stdio protocol adapter over giga-core;
# it lives with the CLI, not the axum web UI. See docs/agents/tuning-configs.md §0.
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["io-std", "macros", "rt", "rt-multi-thread"] }
rusqlite = { version = "0.30", features = ["bundled"] }

[dev-dependencies]
tempfile = "=3.10.1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.30", features = ["bundled"] }
