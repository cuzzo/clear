[package]
name = "giga-ui"
version = "0.0.1"
edition = "2021"
description = "Gigasail web UI, language server, and MCP surfaces"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "giga_ui"
path = "src/lib.rs"

[[bin]]
name = "giga-ui"
path = "src/main.rs"

[dependencies]
giga-core = { path = "../giga-core", version = "0.0.1" }
anyhow = "1.0"
askama = "0.12"
axum = "0.7"
clap = { version = "=4.4.18", features = ["derive"] }
git2 = "0.18"
rayon = "1.8"
rusqlite = { version = "0.30", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["io-std", "macros", "net", "rt", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["set-header", "trace"] }
tower-lsp = "0.20"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
url = "2.5"

[dev-dependencies]
tempfile = "=3.10.1"
