[package]
name = "decomplex-rust"
version = "0.1.0"
edition = "2021"
description = "Native fact extraction slices for Decomplex"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "decomplex-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
fact-mine-rust = { path = "../fact-mine" }
hazard-contract = { path = "../hazard-contract" }

[dev-dependencies]
tempfile = "=3.10.1"
