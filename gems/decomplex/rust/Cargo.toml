[package]
name = "decomplex-rust"
version = "0.1.0"
edition = "2021"
description = "Native fact extraction slices for Decomplex"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "decomplex-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "=0.25.8"
tree-sitter-language = "=0.1.3"
tree-sitter-ruby = "=0.23.1"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-lua = "=0.4.1"

[dev-dependencies]
tempfile = "=3.10.1"
