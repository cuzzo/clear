AllCops:
  TargetRubyVersion: 3.2
  NewCops: disable
  DisabledByDefault: true
  Exclude:
    - 'coverage/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

Lint/DuplicateBranch:
  Enabled: true
Lint/DuplicateCaseCondition:
  Enabled: true
Lint/DuplicateElsifCondition:
  Enabled: true
Lint/DuplicateHashKey:
  Enabled: true
Lint/DuplicateMethods:
  Enabled: true
Lint/EmptyConditionalBody:
  Enabled: true
Lint/EmptyEnsure:
  Enabled: true
Lint/EmptyExpression:
  Enabled: true
Lint/FloatComparison:
  Enabled: true
Lint/MissingSuper:
  Enabled: true
Lint/NonLocalExitFromIterator:
  Enabled: true
Lint/RedundantSafeNavigation:
  Enabled: true
Lint/RescueException:
  Enabled: true
Lint/SafeNavigationChain:
  Enabled: true
Lint/SafeNavigationConsistency:
  Enabled: true
Lint/SelfAssignment:
  Enabled: true
Lint/SuppressedException:
  Enabled: true
Lint/UnreachableCode:
  Enabled: true
Lint/UselessAccessModifier:
  Enabled: true
Lint/UselessAssignment:
  Enabled: true
Lint/UselessMethodDefinition:
  Enabled: true
Lint/Void:
  Enabled: true

Security/Eval:
  Enabled: true
Security/JSONLoad:
  Enabled: true
Security/MarshalLoad:
  Enabled: true
Security/Open:
  Enabled: true
Security/YAMLLoad:
  Enabled: true
